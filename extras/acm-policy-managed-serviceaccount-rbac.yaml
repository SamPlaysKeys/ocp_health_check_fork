# =============================================================================
# ACM Policy: grant the pre-upgrade health check's ManagedServiceAccount
# read access on every managed cluster.
#
# NOT applied automatically by the playbook or by acm_create_managed_service_accounts
# - this is a reference manifest to review, adapt, and `oc apply -f` yourself on
# the hub. Why a Policy and not something the playbook does directly: a
# ManagedServiceAccount's token is only useful once a ClusterRoleBinding
# exists on the SPOKE granting that ServiceAccount something to read, and
# creating that binding is exactly the kind of "make sure this exists on
# every managed cluster, forever, self-healing if drifted" job ACM's Policy
# framework is for - not a one-shot Ansible task. See README.md's ACM
# section for the full picture of how this fits together with
# acm_create_managed_service_accounts / acm_cascade_enabled.
#
# What this grants the ManagedServiceAccount's ServiceAccount, on every
# managed cluster the Placement below targets:
#   - cluster-reader (via a ClusterRoleBinding) - covers every read this
#     playbook needs EXCEPT the etcd exec calls.
#   - pods/exec in openshift-etcd (via a scoped ClusterRole + RoleBinding) -
#     matches the note in README.md that cluster-reader alone does not grant
#     exec, and in stock OpenShift only cluster-admin normally has it.
#
# BEFORE APPLYING, review and adjust for your environment:
#   - The ServiceAccount namespace below (open-cluster-management-agent-addon)
#     is where ACM's managed-serviceaccount add-on agent creates the
#     ServiceAccount on each spoke, as of the ACM versions this was written
#     against - confirm this still matches your ACM version
#     (`oc get sa -n open-cluster-management-agent-addon` on a spoke after
#     the add-on has run once is the definitive check).
#   - The ServiceAccount/ManagedServiceAccount name (ocp-preupgrade-healthcheck)
#     must match `acm_msa_name` in group_vars/all.yml.
#   - The Policy/PlacementBinding namespace and the Placement's cluster
#     targeting (below it's an unrestricted Placement matching every
#     ManagedCluster bound into this namespace's ManagedClusterSet(s) - most
#     ACM installs will need a ManagedClusterSetBinding here, or a
#     `predicates:` clusterSelector, to scope or even enable this at all).
#     Narrow this to a specific ManagedClusterSet or a labelSelector before
#     applying broadly - don't grant this to every cluster in the fleet
#     without thinking about it first.
# =============================================================================
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  # Bind whichever ManagedClusterSet actually contains the clusters you want
  # this RBAC on - "default" is ACM's out-of-the-box set name in many
  # installs, but confirm with `oc get managedclustersets`.
  name: default
  namespace: open-cluster-management-policies
spec:
  clusterSet: default
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-preupgrade-healthcheck-rbac
  namespace: open-cluster-management-policies
spec:
  clusterSets:
    - default
  # No further predicates = matches every cluster in the "default"
  # ManagedClusterSet. Add a labelSelector here to scope it down, e.g. to
  # only production or only OpenShift clusters.
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-preupgrade-healthcheck-rbac
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-3 Access Enforcement
    policy.open-cluster-management.io/description: >-
      Grants the OCP pre-upgrade health check's ManagedServiceAccount
      read-only access (plus openshift-etcd pods/exec) on every targeted
      managed cluster. Self-healing: ACM re-applies this if the bindings
      drift or are deleted.
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: preupgrade-healthcheck-rbac
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: ocp-preupgrade-healthcheck
                subjects:
                  - kind: ServiceAccount
                    name: ocp-preupgrade-healthcheck
                    namespace: open-cluster-management-agent-addon
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-reader
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: ocp-preupgrade-healthcheck-etcd-exec
                rules:
                  - apiGroups: [""]
                    resources: ["pods/exec"]
                    verbs: ["create"]
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: ocp-preupgrade-healthcheck-etcd-exec
                  namespace: openshift-etcd
                subjects:
                  - kind: ServiceAccount
                    name: ocp-preupgrade-healthcheck
                    namespace: open-cluster-management-agent-addon
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: ocp-preupgrade-healthcheck-etcd-exec
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-preupgrade-healthcheck-rbac
  namespace: open-cluster-management-policies
placementRef:
  name: placement-preupgrade-healthcheck-rbac
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-preupgrade-healthcheck-rbac
    apiGroup: policy.open-cluster-management.io
    kind: Policy
