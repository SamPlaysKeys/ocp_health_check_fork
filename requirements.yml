---
# Install with: ansible-galaxy collection install -r requirements.yml
# Install ansible-core from requirements.txt first (2.16+ recommended, 2.12
# minimum): current kubernetes.core releases warn on older Ansible, and pod
# exec (etcd, ODF, opm render) fails with errors like "'NoneType' object has
# no attribute 'decode'" with an old OS-packaged Ansible/kubernetes client.
collections:
  - name: kubernetes.core
    version: ">=3.0.0"
  - name: community.general
    version: ">=8.0.0"
  - name: ansible.utils
    version: ">=3.0.0"

# Python dependencies, including ansible-core itself: see requirements.txt.
