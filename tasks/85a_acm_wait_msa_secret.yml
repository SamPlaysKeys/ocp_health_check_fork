---
# Included once per candidate cluster (via `loop:` on include_tasks in
# tasks/85_acm.yml) so retries/until apply to a single secret lookup, not
# the whole loop at once. Expects `acm_msa_wait_item` (one row from
# acm_managed_clusters_report) as the loop var.
- name: "Poll for the ManagedServiceAccount token Secret ({{ acm_msa_wait_item.name }})"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ acm_msa_wait_item.name }}"
    name: "{{ acm_msa_name }}"
  register: _acm_msa_secret_single
  # Only worth retrying when we just asked the add-on to create a fresh CR;
  # if acm_create_managed_service_accounts is false we're only reading
  # whatever a human/policy already provisioned, so check once and move on.
  retries: "{{ acm_msa_wait_retries if acm_create_managed_service_accounts | bool else 1 }}"
  delay: "{{ acm_msa_wait_delay }}"
  until: _acm_msa_secret_single.resources | default([]) | length > 0
  ignore_errors: true

- name: "Record the poll result for {{ acm_msa_wait_item.name }}"
  # Manually accumulating into a list here (rather than relying on `register`
  # + `loop` to build `.results`) keeps the shape identical to the Hive
  # secret lookup above: a plain list of {item: <cluster-name-string>,
  # resources: [...]} dicts, which is what acm_resolve_cascade_targets in
  # the filter plugin expects for both.
  ansible.builtin.set_fact:
    _acm_msa_secret_results: "{{ (_acm_msa_secret_results | default([])) + [{'item': acm_msa_wait_item.name, 'resources': _acm_msa_secret_single.resources | default([])}] }}"
